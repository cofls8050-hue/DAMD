<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  .pf-slider{
    --pf-bg:#111214;
    --pf-panel:#1b1c1f;
    --pf-accent:#e8e6df;
    --pf-muted:#8a8b90;
    max-width:820px;
    margin:0 auto;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color:var(--pf-accent);
    background:var(--pf-bg);
    padding:18px;
    border-radius:14px;
    box-sizing:border-box;
  }
  .pf-slider *{box-sizing:border-box;}

  .pf-stage{ position:relative; display:flex; align-items:center; gap:8px; }

  .pf-frame{
    position:relative; flex:1; background:var(--pf-panel);
    border-radius:10px; overflow:hidden; display:flex;
    align-items:center; justify-content:center; aspect-ratio:16/10;
  }
  .pf-image{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }

  .pf-media{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .pf-media .pf-image{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }
  .pf-media .pf-video{ width:100%; height:100%; border:0; display:block; }

  .pf-caption{
    position:absolute; left:10px; bottom:10px; max-width:70%;
    background:rgba(0,0,0,.55); padding:6px 12px; border-radius:8px;
    font-size:13px; line-height:1.4; text-align:left;
  }
  .pf-caption:empty{ display:none; }

    .pf-note{
    position:absolute; right:10px; top:10px; max-width:60%;
    background:rgba(0,0,0,.55); padding:4px 10px; border-radius:8px;
    font-size:12px; line-height:1.4; text-align:right;
  }
  .pf-note:empty{ display:none; }

  .pf-counter{
    position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.55);
    padding:4px 10px; border-radius:20px; font-size:12px; letter-spacing:.03em;
  }

  .pf-arrow{
    flex:0 0 auto; width:40px; height:40px; border:none; border-radius:50%;
    background:var(--pf-panel); color:var(--pf-accent); font-size:16px; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .pf-arrow:hover{ background:#2a2b2f; transform:scale(1.06); }
  .pf-arrow:active{ transform:scale(.96); }

  .pf-thumbs{
    display:flex; flex-wrap:nowrap; overflow-x:auto; gap:0; margin-top:12px;
    border-radius:8px; overflow-y:hidden; scrollbar-width:thin;
  }
  .pf-thumbs::-webkit-scrollbar{ height:5px; }
  .pf-thumbs::-webkit-scrollbar-thumb{ background:#3b3c40; border-radius:4px; }

  .pf-thumb{
    flex:0 0 auto; width:104px; height:64px; object-fit:cover; cursor:pointer;
    filter:brightness(.55); transition:filter .15s ease; display:block;
  }
  .pf-thumb:hover{ filter:brightness(.85); }
  .pf-thumb.active{ filter:brightness(1); outline:2px solid var(--pf-accent); outline-offset:-2px; }

  @media (max-width:520px){
    .pf-arrow{ width:34px; height:34px; font-size:14px; }
    .pf-slider{ padding:12px; }
    .pf-thumb{ width:84px; height:52px; }
  }
</style>
</head>
<body>

<div id="pf-slider" class="pf-slider">
  <div class="pf-stage">
    <button class="pf-arrow pf-prev" aria-label="이전 작품" onclick="pfMove(-1)">&#10094;</button>
    <div class="pf-frame">
      <div id="pf-media" class="pf-media"></div>
      <div id="pf-caption" class="pf-caption"></div>
      <div id="pf-note" class="pf-note"></div>
      <div class="pf-counter"><span id="pf-current">1</span> / <span id="pf-total">1</span></div>
    </div>
    <button class="pf-arrow pf-next" aria-label="다음 작품" onclick="pfMove(1)">&#10095;</button>
  </div>
  <div id="pf-thumbs" class="pf-thumbs"></div>
</div>

  // 주소 뒤 ?start=1&end=12 로 보여줄 구간을 정합니다. 없으면 전체를 보여줍니다. true면 캡션 보임, false면 캡션 숨김
  var params = new URLSearchParams(window.location.search);
  var minId = Math.min.apply(null, ALL_SLIDES.map(function(s){ return s.id; }));
  var maxId = Math.max.apply(null, ALL_SLIDES.map(function(s){ return s.id; }));
  var startN = parseFloat(params.get('start') || String(minId));
  var endN = parseFloat(params.get('end') || String(maxId));
  var slides = ALL_SLIDES.filter(function(s){ return s.id >= startN && s.id <= endN; });
  var SHOW_CAPTION = false;

  var idx = 0;
  var mediaEl = document.getElementById('pf-media');
  var capEl = document.getElementById('pf-caption');
  var noteEl = document.getElementById('pf-note');
  var curEl = document.getElementById('pf-current');
  var totEl = document.getElementById('pf-total');
  var thumbsEl = document.getElementById('pf-thumbs');
  var thumbNodes = [];

  function reportHeight(){
    var h = document.getElementById('pf-slider').offsetHeight;
    window.parent.postMessage({ type: 'resize', height: h }, '*');
  }

  function render(){
    var s = slides[idx];
    mediaEl.innerHTML = '';
    if (s.type === 'youtube') {
      var iframe = document.createElement('iframe');
      iframe.className = 'pf-video';
      iframe.src = 'https://www.youtube.com/embed/' + s.videoId;
      iframe.title = s.caption || ('유튜브 영상 ' + (idx + 1));
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      iframe.setAttribute('allowfullscreen', '');
      mediaEl.appendChild(iframe);
    } else {
      var img = document.createElement('img');
      img.className = 'pf-image';
      img.src = s.gif;
      img.alt = s.caption || ('포트폴리오 이미지 ' + (idx + 1));
      mediaEl.appendChild(img);
    }
    capEl.textContent = SHOW_CAPTION ? (s.caption || '') : '';
    noteEl.textContent = s.note || '';
    curEl.textContent = idx + 1;
    totEl.textContent = slides.length;
    thumbNodes.forEach(function(t, i){ t.classList.toggle('active', i === idx); });
    if (thumbNodes[idx]) thumbNodes[idx].scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
  }

  function buildThumbs(){
    thumbsEl.innerHTML = '';
    thumbNodes = [];
    slides.forEach(function(s, i){
      var t = document.createElement('img');
      t.className = 'pf-thumb';
      t.src = s.thumb || s.gif;
      t.alt = (s.caption || ('작품 ' + (i + 1))) + ' 미리보기';
      t.loading = 'lazy';
      t.addEventListener('click', function(){ idx = i; render(); });
      thumbsEl.appendChild(t);
      thumbNodes.push(t);
    });
  }

  window.pfMove = function(dir){
    idx = (idx + dir + slides.length) % slides.length;
    render();
  };

  document.getElementById('pf-slider').setAttribute('tabindex', '0');
  document.getElementById('pf-slider').addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') pfMove(-1);
    if (e.key === 'ArrowRight') pfMove(1);
  });

  buildThumbs();
  render();

  // 아트머그 페이지 쪽에서 iframe 높이를 자동으로 맞출 수 있도록 알려줌
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  setTimeout(reportHeight, 300);
</script>

</body>
</html>
